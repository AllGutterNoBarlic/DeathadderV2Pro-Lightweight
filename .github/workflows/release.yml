name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write      # create releases
  id-token: write      # build provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Installs it, or upgrades an older preinstalled copy (the script needs Inno Setup 6.3+).
          choco upgrade innosetup -y --no-progress

      - name: Version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Tag v1.2.3 -> 1.2.3; other builds -> 0.0.<run number> (Windows file versions must be numeric)
          $v = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME.TrimStart("v") } else { "0.0.$env:RUN_NUMBER" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3 (got '$env:REF_NAME')" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Build portable (zip of plain files; needs .NET Desktop Runtime)
        shell: pwsh
        run: |
          dotnet publish src/DeathAdderTool.csproj -c Release -p:Version=${{ env.VERSION }} -p:SelfContained=false -o out/portable
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/portable/* -DestinationPath "dist/DeathAdderTool-portable-${{ env.VERSION }}.zip"

      - name: Self-test (offline parser + command list checks)
        shell: pwsh
        run: |
          $p = Start-Process out/portable/DeathAdderTool.exe -ArgumentList --selftest -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput selftest.out -RedirectStandardError selftest.err
          Get-Content selftest.out, selftest.err
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Build self-contained folder (for the installer)
        run: dotnet publish src/DeathAdderTool.csproj -c Release -p:Version=${{ env.VERSION }} -p:SelfContained=true -p:PublishSingleFile=false -o dist/self-contained

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.VERSION }} installer\DeathAdderTool.iss'
        shell: pwsh

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object Extension -in '.exe', '.zip' | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: DeathAdderTool
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
